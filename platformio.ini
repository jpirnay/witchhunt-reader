[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
name = "Witch Reader"
version = 2.26

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DMAINTAIN_FREE_CLUSTER_COUNT=1 ; let sdFat cache cluster count data to speed up free space calculations
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
  -Wno-bidi-chars
  -Wno-deprecated-declarations
# Place TJpgDec's hot decode loop (huffext/bitext/block_idct/mcu_load) in IRAM to
# drop i-cache miss stalls on the single-core C3. Perf A/B knob; set 0 to revert.
  -DJD_FASTPATH_IRAM=1
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions
# Use the (patched) UZLIB Memcpy 'optimisation' for the LZ-copy path
  -DUZLIB_CONF_USE_MEMCPY=1
# wolfSSL TLS 1.3 backend (SecureNet). Client-only lean profile via scripts/patch_wolfssl.py.
# The SP (single-precision math) backend is architecture-specific and lives in the
# per-MCU sections below, NOT here.
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

custom_sdk_config = 
  ; Task stack right-sizing from measured high-water marks (heap block map +
  ; per-task stack audit, July 2026): esp_timer used ~0.8 KB of 8 KB across
  ; every capture; the FreeRTOS timer service used ~0.5 KB
  ; of 4 KB. Neither runs TLS or app code. ~7 KB back to the heap.
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  ; Move the WiFi stack's non-critical hot paths out of IRAM into flash.
  ; On the C3, IRAM and DRAM share one SRAM pool, so the ~25-30 KB this
  ; frees lands directly in the heap — paid for with lower WiFi throughput
  ; during transfers (occasional sync/OTA use, not streaming: acceptable).
  ; IRAM cost is static, so the heap gain applies even with WiFi off.
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
   ; Keep the Arduino wrappers for the removed cloud components (below) out of
  ; the core source list; all other bundled libraries default to enabled.
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  ; ESP_SR (speech recognition) only exists in the S3 core; its wrapper includes
  ; ESP_I2S.h, which the isolated core rebuild can't resolve. Unused here anyway,
  ; so drop it or the sticky env fails to build.
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n

; Drop unused cloud components from the core rebuild. esp_insights/rainmaker
; require embedded server certs the lib builder can't generate
; ("https_server.crt.S not found"); this firmware uses none of them.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

extra_scripts =
  pre:scripts/patch_uzlib.py
  pre:scripts/patch_wolfssl.py
  pre:scripts/gen_roots.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
; RTC driver for the PCF8563 family, used by HalClock. The DS3231 is still driven
; inline there (X3's path, device-validated), so this only carries the boards the
; inline code cannot serve. Compiles to stub bodies unless FREEINK_CAP_RTC is set
; for the board, so adding it here costs nothing on boards that do not use it.
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
; Header-only C++17 geometry (Rect, ScreenEdge, edgeSwipe, swipeDirection,
; touchToLogical). Linked for the touch layer's gesture classification so we
; don't reimplement it; the widget/app half of FreeInkUI is not used yet. Adding
; it cost the C3 zero bytes — nothing includes it on a non-touch build.
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  bblanchon/ArduinoJson @ 7.4.2
  QRCode=symlink://lib/QRCode
  links2004/WebSockets @ 2.7.3
  SaxParser=symlink://lib/SaxParser
  SerialTransfer=symlink://lib/SerialTransfer
  SecureNet=symlink://lib/SecureNet
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  BLE

; ---------------------------------------------------------------------------
; Per-MCU-family flag sets.
;
; BoardConfig.h hard-#errors unless every selected -DFREEINK_DEVICE_* belongs to
; ONE MCU family (C3 / S3 / ESP32) — they differ in deep-sleep wakeup, SPI
; peripheral count, and toolchain, so they never share a binary. Keeping the
; device set in [base] therefore broke every S3 env; these sections exist so an
; env opts into exactly one family. Not envs themselves — interpolation only.
; ---------------------------------------------------------------------------

[c3]
; Xteink X3 + X4 (ESP32-C3, RISC-V). Both linked into one binary and chosen at
; runtime via setDisplayX3(); drives BoardConfig's driver/geometry/pin tables and
; sizes MAX_FRAMEBUFFER_BYTES to the larger panel.
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
; Optional: overclock the X4 display SPI from the in-spec 20 MHz to 40 MHz (what
; the old open-x4-sdk used). Saves ~17-20 ms/refresh on X4 plane writes but is 2x
; the SSD1677 datasheet max — validate on hardware before enabling. See
; FREEINK_X4_OVERCLOCK_SPI in freeink-sdk BoardConfig.h.
  -DFREEINK_X4_OVERCLOCK_SPI
; Optional: X4 fast-DU shortcut (CTRL2=0x1C instead of the stock 0xFC partial
; sequence). Saves ~85 ms/refresh but skips the per-refresh temperature load and
; power sequencing; upstream saw long-session ghosting/blotching on some panels.
; Enable only after validating on hardware. See FREEINK_X4_FAST_DU_SHORTCUT in
; freeink-sdk Ssd1677Driver.cpp and docs/deferred-refresh-migration.md.
;  -DFREEINK_X4_FAST_DU_SHORTCUT
; wolfSSL RISC-V assembly speedups. Emits RISC-V inline asm from sp_int.c, which
; the Xtensa assembler rejects outright — C3 only.
  -DWOLFSSL_SP_RISCV32

[s3]
; ESP32-S3 (Xtensa) boards: X4 Pro, LilyGo T5S3. The device flag itself comes
; from the env, since these boards do NOT currently share a binary.
build_flags =
  ${base.build_flags}
; Portable C SP math. The RISC-V path above cannot assemble on Xtensa; this is
; what upstream uses for all of its S3 targets.
  -DWOLFSSL_SP_SMALL

[env:default]
extends = base
build_flags =
  ${c3.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes current branch)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
build_flags =
  ${c3.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${c3.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${c3.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; ---------------------------------------------------------------------------
; Standalone SaxParser benchmark — flashes a minimal sketch that prints
; timing and heap results over serial then halts. No SD card required;
; fixture data is embedded in flash.
; Build & flash: pio run -e bench -t upload
; Monitor:       pio device monitor -e bench
; ---------------------------------------------------------------------------
[env:bench]
extends = base
build_src_filter = -<*> +<../bench/>
build_flags =
  ${c3.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=0
lib_deps =
  SaxParser=symlink://lib/SaxParser

; ---------------------------------------------------------------------------
; Xteink X4 Pro — ESP32-S3, SSD1677 800x480 + GT911 touch + warm/cold frontlight.
; Lead board for multi-board bring-up; see docs/multi-board-bringup-2026-08-14.md.
; Build & flash: pio run -e x4pro -t upload
; ---------------------------------------------------------------------------
[env:x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${s3.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4pro\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
; X4 Pro's SD is native SDMMC (1-bit), mounted through SdFat's block-device API
; rather than the SPI path the C3 boards use.
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:lilygo_t5s3]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
; The module is an ESP32-S3-WROOM-1-N16R8: 16 MB flash + 8 MB OPI PSRAM. Both
; lines are required for the PSRAM to be initialised at all — memory_type picks
; the flash/PSRAM pin mode (quad flash + octal PSRAM), and without it the RAM is
; simply absent. Unlike the X4 Pro, this board CANNOT run without it: the panel
; is 960x540 16-gray, so LovyanGFX's framebuffer does not fit in the S3's
; internal RAM alongside the reader. Matches upstream/feat-touch's env.
; qio matches upstream/feat-touch. Tested against dio on 2026-08-17 because the
; hardware RST button leaves this board frozen rather than rebooting: flash mode
; made NO difference, so it is not the cause and we keep upstream's setting.
; See the RST note in docs/multiboard-bringup-handover-2026-08-15.md.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
  ${s3.build_flags}
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_LILYGO=1
; Bring-up aid: log every raw button edge (index + name + live mask) as
; InputManager reports it, before any mapping or press-type handling. Covers
; expander-backed buttons that the SDK's ADC-ladder diagnostic cannot see.
; Drop this once the board's input is settled.
  -DBUTTON_TRACE=1
; The board carries a PCF8563TS RTC at 0x51 (vendor schematic page 3 / U3; the
; README's "PCF85063" is wrong and the vendor's own notes say to trust the
; schematic). The SDK's default FREEINK_CAP_RTC list does not include LILYGO, so
; without this the Rtc lib links stub bodies and begin() always returns false.
  -DFREEINK_CAP_RTC=1
  -DFREEINK_LGFX_EPD_CONFIG=lilygoT5S3LgfxConfig
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-lilygo\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
lib_deps =
  ${base.lib_deps}
  BoardT5S3=symlink://freeink-sdk/libs/hardware/BoardT5S3
  m5stack/M5GFX @ 0.2.20
