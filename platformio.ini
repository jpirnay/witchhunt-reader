[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
name = "Witch Reader"
version = 2.10

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
# FreeInk SDK device set: X4 (SSD1677) + X3 (UC8253) both linked into the C3 bin,
# chosen at runtime via setDisplayX3(). Drives BoardConfig's driver/geometry/pin
# tables and sizes MAX_FRAMEBUFFER_BYTES to the larger panel.
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
# Optional: overclock the X4 display SPI from the in-spec 20 MHz to 40 MHz (what
# the old open-x4-sdk used). Saves ~17-20 ms/refresh on X4 plane writes but is 2x
# the SSD1677 datasheet max — validate on hardware before enabling. See
# FREEINK_X4_OVERCLOCK_SPI in freeink-sdk BoardConfig.h.
  -DFREEINK_X4_OVERCLOCK_SPI
# Optional: X4 fast-DU shortcut (CTRL2=0x1C instead of the stock 0xFC partial
# sequence). Saves ~85 ms/refresh but skips the per-refresh temperature load and
# power sequencing; upstream saw long-session ghosting/blotching on some panels.
# Enable only after validating on hardware. See FREEINK_X4_FAST_DU_SHORTCUT in
# freeink-sdk Ssd1677Driver.cpp and docs/deferred-refresh-migration.md.
#  -DFREEINK_X4_FAST_DU_SHORTCUT
  -DARDUINO_USB_MODE=1
  -DMAINTAIN_FREE_CLUSTER_COUNT=1 ; let sdFat cache cluster count data to speed up free space calculations
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
  -Wno-bidi-chars
  -Wno-deprecated-declarations
# Place TJpgDec's hot decode loop (huffext/bitext/block_idct/mcu_load) in IRAM to
# drop i-cache miss stalls on the single-core C3. Perf A/B knob; set 0 to revert.
  -DJD_FASTPATH_IRAM=1
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions
# Use the (patched) UZLIB Memcpy 'optimisation' for the LZ-copy path
  -DUZLIB_CONF_USE_MEMCPY=1
# wolfSSL TLS 1.3 backend (SecureNet). Client-only lean profile via scripts/patch_wolfssl.py.
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_SP_RISCV32

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/patch_uzlib.py
  pre:scripts/patch_wolfssl.py
  pre:scripts/gen_roots.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  bblanchon/ArduinoJson @ 7.4.2
  QRCode=symlink://lib/QRCode
  links2004/WebSockets @ 2.7.3
  SaxParser=symlink://lib/SaxParser
  SerialTransfer=symlink://lib/SerialTransfer
  SecureNet=symlink://lib/SecureNet
  wolfssl/Arduino-wolfSSL @ 5.7.2

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes current branch)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; ---------------------------------------------------------------------------
; Standalone SaxParser benchmark — flashes a minimal sketch that prints
; timing and heap results over serial then halts. No SD card required;
; fixture data is embedded in flash.
; Build & flash: pio run -e bench -t upload
; Monitor:       pio device monitor -e bench
; ---------------------------------------------------------------------------
[env:bench]
extends = base
build_src_filter = -<*> +<../bench/>
build_flags =
  ${base.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=0
lib_deps =
  SaxParser=symlink://lib/SaxParser

; ---------------------------------------------------------------------------
; G4 pull-core latency + background-compile-throughput gate.
; Opens a real book from SD, compiles it to content.bin (measures compile ms +
; throughput — the background-compile half of the strategy), then sweeps
; layoutPage forward + layoutPageBackward (measures ms/page + heap/contig — the
; live-read half). Prints BENCH lines over serial, halts. Full base stack (SD,
; Epub, ZipFile, PageLayout). Set BENCH_BOOK to the SD path.
; Build & flash: pio run -e bench_pagelayout -t upload
; Monitor:       pio device monitor -e bench_pagelayout
; ---------------------------------------------------------------------------
[env:bench_pagelayout]
extends = base
; Just the bench sketch + the platform shims the base --wrap linker flags require
; (skip_efuse_blk_check.c provides __wrap_bootloader_common_check_efuse_blk_validity).
build_src_filter = -<*> +<../bench_pagelayout/> +<platform/>
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"bench-pagelayout\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DEPUB_STAGE1=1
  ; The book to measure. Swap to /books/small-gods.epub for the giant-single-spine case.
  -DBENCH_BOOK=\"/books/kings-avatar.epub\"
  ; Split the extract phase into inflate-CPU vs SD-write (see Section.cpp EXTRACTPROF).
  -DBENCH_EXTRACT_PROFILE=1
  ; Wipe the book's HTML cache + content.bin first, so the compile runs COLD (inflate fires).
  -DBENCH_COLD=1

