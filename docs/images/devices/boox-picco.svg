<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="BOOX Picco: keys">
<title>BOOX Picco: keys</title>
<rect width="480" height="560" rx="10" fill="#ffffff"/>
<rect x="140" y="105" width="200" height="350" rx="20" fill="#eeeeee" stroke="#222222" stroke-width="2"/>
<rect x="156" y="121" width="168" height="280" rx="3" fill="#ffffff" stroke="#999999"/>
<text x="240.0" y="265.0" text-anchor="middle" fill="#999999" font-size="15">Screen</text>
