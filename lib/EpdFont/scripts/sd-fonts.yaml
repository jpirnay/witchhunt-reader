# SD Card Font Families for CrossPoint Reader
#
# This file is the single source of truth for which fonts are generated,
# how they're sourced, and how they're described in the download manifest.
#
# Adding a new font family = adding a block here. No code changes needed.
#
# Fields:
#   name:        Output family name (used in filenames and on-device UI)
#   description: Human-readable description (shown in download UI and manifest)
#   intervals: builtin,  Comma-separated Unicode interval presets for fontconvert_sdcard.py
#   sizes:       Point sizes to generate
#   styles:      Map of style name -> font source
#                  path: relative to lib/EpdFont (for committed fonts)
#                  url:  download URL (for fonts not in the repo)
#
# UI script packs (format: uipack):
#   .cpfont files the interface draws a script from (src/UiScriptPack.cpp, src/CjkUiPack.cpp), never a reading font;
#   build_ui_script_pack.py writes them. They take in place of intervals, sizes and styles:
#   source:        the family in this file they are cut from: its files (ArabicUI), or the Noto CJK OTF it pins
#   fonts-v3.json lists them with format "uipack", which a firmware that does not know it skips; fonts.json leaves
#   them out.
#
# CJK families (format: otf):
#   A CFF subset of Noto CJK cut by cjk_subset.py: one <name>-Regular.otf, drawn at every size by the reader's
#   engine, instead of a .cpfont family. They take these fields in place of intervals, sizes and styles:
#   format:        otf
#   charset:       ja, zh-Hans, zh-Hant or ko (cjk_subset.CHARSETS)
#   fontName:      the family name written into the font
#   source:        {url, sha256} of the Noto CJK region OTF (or {path}); the build fails when the hash differs
#   inDownloadAll: false keeps the family out of "Download all"
#   Rebuilding them needs the pinned fontTools (top-level `fonttools`, another version writes other bytes):
#     pip install fonttools==4.63.0
#
# TrueType families (format: ttf):
#   A Noto script font merged with Noto's Latin (merge_noto_latin.py): <name>-Regular.ttf and <name>-Bold.ttf,
#   drawn at every size by the reader's engine. They take these fields in place of intervals, sizes and styles:
#   format:        ttf
#   merge:         {script: {Regular: S, Bold: S}, latin: {Regular: S, Bold: S}}, each S a {url, sha256}: the
#                  script's Noto font and Noto Sans or Noto Serif; the build fails when a hash differs
#   inDownloadAll: false keeps the family out of "Download all"
#   After the merge the build checks it with HarfBuzz (the script font's own shaping, Noto's Latin kept whole) and
#   fails on any difference. Rebuilding them needs the pinned pair (top-level `fonttools`, another version writes
#   other bytes):
#     pip install fonttools==4.63.0 uharfbuzz==0.56.2
#
# Hyphenation packs (format: hyphenation):
#   One language's hyphenation pack, hyph-<code>.cphyph in a folder of the family's name. scripts/build_hyphenation_packs.py
#   writes them into assets/sd-fonts/ (this build copies them). fonts-v3.json lists them after the fonts with format
#   "hyphenation", which a firmware that does not know it skips; fonts.json leaves them out. The Font Manager installs
#   the file into /.crosspoint/hyphenation/. They take no fields but name, description and inDownloadAll (false: a
#   reader picks the languages of their books).
#
# Variable fonts:
#   Some fonts (Bitter, Inter, Alegreya) are distributed as variable fonts.
#   freetype-py can't set variable font axis values, so the build script
#   uses fonttools.instancer to extract static instances automatically.
#
#   To use a variable font, add a 'variable' key to the style spec with
#   axis values to pin:
#
#     styles:
#       regular: {url: "https://...Font[wght].ttf", variable: {wght: 400}}
#       bold:    {url: "https://...Font[wght].ttf", variable: {wght: 700}}
#
#   Extracted static fonts are cached in instanced_fonts/ (gitignored).
#   Requires fonttools: pip install -r requirements.txt

# The Unicode Han database the CJK character sets read (cjk_subset.py), pinned to a release.
unihan: {url: "https://www.unicode.org/Public/17.0.0/ucd/Unihan.zip", sha256: "f7a48b2b545acfaa77b2d607ae28747404ce02baefee16396c5d2d7a8ef34b5e"}

# The fontTools version the CJK subsets are built with: the build refuses any other.
fonttools: "4.63.0"

