; Standalone firmware for the Murphy M3 gray tests. Not part of the reader build.
;
; Platform, board and flash layout match [murphy_board] in the root platformio.ini, so flashing
; this leaves the partition table as it was. A plain `pio run -e murphy -t upload` from the repo
; root puts the reader back.
[platformio]
default_envs = murphy_gray_lab

[env:murphy_gray_lab]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = ../../partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
