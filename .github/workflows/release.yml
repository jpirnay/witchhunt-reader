name: Compile Release

# One binary per board, each named exactly as the firmware's own OTA check asks
# GitHub for (see src/network/FirmwareBoardTag.h): plain firmware.bin for the
# combined C3 X3/X4 binary — the name pre-existing releases already use, so
# devices in the field keep updating — and firmware-<board>.bin for every other
# board. The legs build in parallel and a single publish job attaches them, so
# two jobs never race on the same release.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: gh_release
            label: X3/X4
            asset: firmware.bin
          - env: lilygo_gh_release
            label: LilyGo T5S3
            asset: firmware-lilygo.bin
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      # terser minifies the inline JS in the embedded web pages (see
      # scripts/build_html.py). Without it the build still succeeds, but the
      # generated pages are ~17% larger - so CI installs it to match a release.
      - name: Install web asset tooling
        run: npm ci

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      # Keyed per env: the C3 and S3 legs pull different toolchain packages, so
      # a shared key would have the two legs overwriting each other's cache.
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.env }}-

      - name: Build CrossPoint
        run: pio run -e ${{ matrix.env }}

      - name: Patch min_chip_rev_full to 0
        run: python3 scripts/patch_min_chip_rev.py .pio/build/${{ matrix.env }}/firmware.bin

      # Every env builds a file called firmware.bin; copy it to the board's
      # asset name. The X3/X4 leg's asset IS firmware.bin, so it needs no copy.
      - name: Name the release asset
        run: |
          if [ "${{ matrix.asset }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.env }}/firmware.bin" \
               ".pio/build/${{ matrix.env }}/${{ matrix.asset }}"
          fi

      - name: Upload ${{ matrix.asset }} artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: .pio/build/${{ matrix.env }}/${{ matrix.asset }}
          if-no-files-found: error

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      # merge-multiple flattens every leg's artifact into one directory, so the
      # upload below attaches all boards' binaries in a single API call.
      - name: Download board binaries
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload release assets
        if: ${{ env.ACT != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*.bin
          fail_on_unmatched_files: true
