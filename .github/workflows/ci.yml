name: CI (build)

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      # terser minifies the inline JS in the embedded web pages (see
      # scripts/build_html.py). Without it the build still succeeds, but the
      # generated pages are ~17% larger - so CI installs it to match a release.
      - name: Install web asset tooling
        run: npm ci

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  build:
    # The C3 boards (X3/X4) and the S3 LilyGo T5S3 are separate binaries built
    # from different toolchains, so each gets its own leg. fail-fast is off so a
    # break on one board still reports the other's result.
    #
    # Asset names match what the firmware's own OTA check asks GitHub for (see
    # src/network/FirmwareBoardTag.h): plain firmware.bin for the combined C3
    # X3/X4 binary, firmware-<board>.bin for every other board.
    name: Build (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: default
            label: X3/X4
            asset: firmware.bin
          - env: lilygo_t5s3
            label: LilyGo T5S3
            asset: firmware-lilygo.bin
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      # terser minifies the inline JS in the embedded web pages (see
      # scripts/build_html.py). Without it the build still succeeds, but the
      # generated pages are ~17% larger - so CI installs it to match a release.
      - name: Install web asset tooling
        run: npm ci

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      # Keyed per env: the C3 and S3 legs pull different toolchain packages, so
      # a shared key would have the two legs overwriting each other's cache.
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.env }}-

      - name: Build CrossPoint
        run: |
          set -euo pipefail
          pio run -e ${{ matrix.env }} 2>&1 | tee pio.log

      # A missing terser is only a warning in build_html.py, so that the build
      # still works for contributors without node. In CI it must be an error:
      # silently shipping ~10KB of un-mangled JS is exactly the regression this
      # tooling exists to prevent.
      - name: Verify web assets were minified
        run: |
          if grep -q "terser not found" pio.log; then
            echo "::error::terser did not run - embedded web pages are ~17% larger than a release build"
            exit 1
          fi

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\\s" -m1 pio.log || true)"
          {
            echo "## Firmware build stats (${{ matrix.label }})"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Every env builds a file called firmware.bin; copy it to the board's
      # asset name so the downloaded file says which board it is for. The X3/X4
      # leg's asset IS firmware.bin, so it needs no copy.
      - name: Name the release asset
        run: |
          if [ "${{ matrix.asset }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.env }}/firmware.bin" \
               ".pio/build/${{ matrix.env }}/${{ matrix.asset }}"
          fi

      - name: Upload ${{ matrix.asset }} artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: .pio/build/${{ matrix.env }}/${{ matrix.asset }}
          if-no-files-found: error

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run standalone tests
        run: |
          set +e
          shopt -s nullglob

          failed=0
          tests=("test/run_*.sh")

          if [ ${#tests[@]} -eq 0 ]; then
            printf 'No tests found in test/ directory\n'
            exit 1
          fi

          run_test() {
            printf '\n== Running %s ==\n' "${1}"
            if ! bash "${1}"; then
              failed=1
            fi
          }

          for t in ${tests[@]}; do
            run_test "$t"
          done

          exit "${failed}"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - run-tests
      - unit-tests
      - clang-format
      - cppcheck
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
