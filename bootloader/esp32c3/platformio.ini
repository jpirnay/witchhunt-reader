; Builds the ESP32-C3 second-stage bootloader the X3 and X4 firmware ships (README.md here).
; Not part of the firmware build: run by hand when the Arduino core's ESP-IDF changes, then
; commit the bootloader.bin it is copied to.
;
;   cd bootloader/esp32c3 && pio run && cp .pio/build/bootloader/bootloader.bin bootloader.bin
;
; The platform is the firmware's (../../platformio.ini), whose framework-espidf is the ESP-IDF
; the Arduino core was built from: the bootloader and the app share the RTC memory it reserves
; (CONFIG_BOOTLOADER_RESERVE_RTC_MEM) and the image and partition formats, so they must match.

[platformio]
default_envs = bootloader

[env:bootloader]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = espidf
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 80000000L
